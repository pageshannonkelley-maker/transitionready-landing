# .github/workflows/anthropic-wif-test.yml
name: anthropic-wif-test
on: push

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange for an Anthropic access token
        run: |
          curl --fail-with-body -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:jwt-bearer\",\"assertion\":\"$JWT\",\"federation_rule_id\":\"fdrl_01RZ2QRzYmhCXKv8SW43v9tN\",\"organization_id\":\"382bd06a-089d-4be2-ae61-b04383714045\",\"service_account_id\":\"svac_01WxuaHV1QgQYGa7Gs8UoZ8U\",\"workspace_id\":\"wrkspc_01LD4kzhXBk6o8wwub2igvjf\"}" \
            | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
